<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Carnival Overlay</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      #pointer {
        position: fixed;
        top: 0;
        left: 0;
        display: none;
        align-items: center;
        gap: 9px;
        pointer-events: none;
        transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .pointer-ring {
        position: relative;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(237, 230, 214, 0.28), transparent 70%);
        box-shadow: 0 0 18px rgba(237, 230, 214, 0.38);
      }
      #pointer-label {
        background: linear-gradient(135deg, rgba(10, 10, 14, 0.84), rgba(16, 16, 20, 0.72));
        backdrop-filter: blur(26px) saturate(160%);
        -webkit-backdrop-filter: blur(26px) saturate(160%);
        color: #f5f2eb;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
      }
      #draw-layer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        filter: drop-shadow(0 0 8px rgba(237, 230, 214, 0.28));
      }
      #speech {
        position: fixed;
        right: 24px;
        bottom: 72px;
        max-width: 380px;
        background: linear-gradient(135deg, rgba(10, 10, 14, 0.86), rgba(16, 16, 20, 0.76));
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        color: #f5f2eb;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 11px 15px;
        font-size: 13px;
        line-height: 1.45;
        display: none;
      }
    </style>
  </head>
  <body>
    <svg id="draw-layer"></svg>
    <div id="pointer">
      <div class="pointer-ring">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 3L20 11L13 13.5L10.5 20.5L4 3Z" fill="#ede6d6" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
      </div>
      <span id="pointer-label"></span>
    </div>
    <div id="speech"></div>
    <script>
      const pointerEl = document.getElementById("pointer");
      const labelEl = document.getElementById("pointer-label");
      const drawEl = document.getElementById("draw-layer");
      const speechEl = document.getElementById("speech");

      function renderState(state) {
        if (!state) return;
        const cmds = Array.isArray(state.commands) ? state.commands : [];
        let latestPoint = null;
        const svgParts = [];

        for (const cmd of cmds) {
          if (cmd.type === "point") {
            latestPoint = cmd;
          } else if (cmd.type === "draw") {
            if (cmd.shape === "rect") {
              svgParts.push(`<rect x="${cmd.x}" y="${cmd.y}" width="${cmd.width}" height="${cmd.height}" fill="rgba(237,230,214,0.08)" stroke="#ede6d6" stroke-width="1.8" rx="10"/>`);
            } else if (cmd.shape === "circle") {
              const cx = cmd.x + cmd.width / 2;
              const cy = cmd.y + cmd.height / 2;
              const r = Math.max(Math.abs(cmd.width), Math.abs(cmd.height)) / 2;
              svgParts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(237,230,214,0.08)" stroke="#ede6d6" stroke-width="1.8"/>`);
            } else {
              svgParts.push(`<line x1="${cmd.x}" y1="${cmd.y}" x2="${cmd.x + cmd.width}" y2="${cmd.y + cmd.height}" stroke="#f5f2eb" stroke-width="2" stroke-linecap="round"/>`);
            }
          }
        }

        drawEl.innerHTML = svgParts.join("");

        if (latestPoint) {
          pointerEl.style.display = "flex";
          pointerEl.style.transform = `translate(${latestPoint.x}px, ${latestPoint.y}px)`;
          labelEl.textContent = latestPoint.label || "Here";
        } else {
          pointerEl.style.display = "none";
        }

        if (state.speech_text) {
          speechEl.style.display = "block";
          speechEl.textContent = state.speech_text;
        } else {
          speechEl.style.display = "none";
        }
      }

      setInterval(function () {
        fetch("http://127.0.0.1:32123/overlay/state")
          .then(function (r) { return r.json(); })
          .then(renderState)
          .catch(function () {});
      }, 300);
    </script>
  </body>
</html>
