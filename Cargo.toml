[workspace]
resolver = "2"
exclude = ["desktop/src-tauri"]
members = [
    "crates/layer0-contracts",
    "crates/layer0-core",
    "crates/layer0-store",
    "crates/layer0-watchdog",
    "crates/layer0-sandbox",
    "crates/layer1-cordis-bus",
    "crates/layer1-router",
    "crates/layer1-adapters",
    "crates/carnival-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
tempfile = "3.13"
portable-pty = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
